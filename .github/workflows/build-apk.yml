name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Faltan secrets KEYSTORE_BASE64/KEYSTORE_PASS: no se publica APK sin firmar." >&2
            exit 1
          fi

      - name: Exclude legacy JPG assets from the APK bundle
        run: find app/src/main/assets/www -name '*.jpg' -delete

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nutrisport-release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/nutrisport-release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dieta-app-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: NutriSport v0.2.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
